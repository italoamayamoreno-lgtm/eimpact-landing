<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — EtraziApp · powered by Etrazia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --midnight:#0B1120;--navy:#111827;--copper:#B87333;--amber:#D97706;
  --ice:#F8FAFC;--graphite:#94A3B8;--graphite-dim:#4B5563;
  --copper-glow:rgba(184,115,51,0.12);
}
body{
  background:var(--midnight);color:var(--ice);
  font-family:'Inter',sans-serif;font-weight:400;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:24px;
  position:relative;overflow:hidden;
}
/* Glow background */
body::before{
  content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(184,115,51,0.08),transparent 70%);
  pointer-events:none;
}
/* Lines */
body::after{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 70% 70% at 50% 30%,black 20%,transparent 80%);
  pointer-events:none;
}
.container{max-width:520px;position:relative;z-index:1}

/* LOGO */
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.logo-text{display:flex;flex-direction:column;line-height:1;text-align:left}
.logo-main{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;letter-spacing:0.08em;color:var(--ice)}
.logo-main span{color:var(--amber);font-weight:400}
.logo-sub{font-size:9px;letter-spacing:0.2em;color:var(--graphite);text-transform:uppercase;margin-top:2px}

.tag{
  font-size:10px;letter-spacing:0.2em;color:var(--graphite-dim);
  text-transform:uppercase;margin-bottom:48px;font-family:'Inter',monospace;
}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(184,115,51,0.08);
  border:1px solid rgba(184,115,51,0.2);
  color:var(--amber);
  font-size:11px;letter-spacing:0.1em;
  padding:7px 16px;border-radius:99px;margin-bottom:32px;
  font-family:'Montserrat',sans-serif;font-weight:500;
}
.dot{
  width:6px;height:6px;border-radius:50%;background:var(--amber);
  animation:pulse 2s infinite;flex-shrink:0;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

h1{
  font-family:'Montserrat',sans-serif;
  font-size:clamp(32px,6vw,52px);font-weight:800;
  letter-spacing:-1.5px;line-height:1.1;margin-bottom:16px;
}
h1 em{font-style:normal;color:var(--copper)}

p{
  font-size:15px;color:var(--graphite);line-height:1.75;
  margin-bottom:40px;max-width:400px;margin-left:auto;margin-right:auto;
}

.cta{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--copper);color:var(--midnight);
  font-family:'Montserrat',sans-serif;font-weight:700;
  font-size:12px;letter-spacing:0.1em;text-transform:uppercase;
  padding:14px 32px;border-radius:4px;text-decoration:none;
  transition:all .25s;
}
.cta:hover{background:var(--amber);transform:translateY(-2px);box-shadow:0 12px 32px rgba(184,115,51,0.3)}

/* Divider */
.divider{
  width:48px;height:1px;
  background:linear-gradient(90deg,var(--copper),var(--amber));
  margin:40px auto;opacity:.4;
}

.footer-note{
  font-size:10px;letter-spacing:0.15em;color:var(--graphite-dim);
  text-transform:uppercase;font-family:'Inter',monospace;
}
.footer-note span{color:rgba(184,115,51,.5)}
</style>
</head>
<body>
<div class="container">

  <div class="logo-wrap">
    <svg width="36" height="36" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 22 C16 15.37 21.37 10 28 10 C34.63 10 40 15.37 40 22 C40 28.63 34.63 34 28 34" stroke="#1B2B4B" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M28 22 C28 28.63 22.63 34 16 34 C9.37 34 4 28.63 4 22 C4 15.37 9.37 10 16 10" stroke="url(#dg)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <rect x="17.5" y="17.5" width="9" height="9" rx="1.5" fill="#D97706" transform="rotate(45 22 22)"/>
      <defs><linearGradient id="dg" x1="28" y1="10" x2="4" y2="34" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#B87333"/><stop offset="100%" stop-color="#D97706"/></linearGradient></defs>
    </svg>
    <div class="logo-text">
      <span class="logo-main">ETRAZIA<span>app</span></span>
      <span class="logo-sub">powered by Etrazia</span>
    </div>
  </div>

  <div class="tag">// demo environment</div>

  <div class="badge"><span class="dot"></span>En preparación</div>

  <h1>La demo estará<br><em>lista pronto.</em></h1>

  <p>Estamos preparando un entorno de demostración con data ficticia para que puedas explorar EtraziApp antes de contratar.</p>

  <a href="https://etraziapp.com" class="cta">Ver planes y precios →</a>

  <div class="divider"></div>

  <div class="footer-note">ETRAZIA SAC · <span>demo.etraziapp.com</span></div>

</div>
</body>
</html>
